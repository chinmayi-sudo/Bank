<!DOCTYPE html>
<html>
<head>
    <title>Bank Account</title>
</head>
<body>

    <h2>Bank Account</h2>

    <!-- Input box -->
    <input type="number" id="amount" placeholder="Enter amount">

    <br><br>

    <!-- Buttons -->
    <button onclick="deposit()">Deposit</button>
    <button onclick="withdraw()">Withdraw</button>
    <button onclick="showBalance()">Check Balance</button>

    <h3 id="result"></h3>

    <script>
        let balance = 0;

        function deposit() {
            let amt = Number(document.getElementById("amount").value);
            balance += amt;
            document.getElementById("result").innerText = "Deposited: " + amt;
        }

        function withdraw() {
            let amt = Number(document.getElementById("amount").value);

            if (amt <= balance) {
                balance -= amt;
                document.getElementById("result").innerText = "Withdrawn: " + amt;
            } else {
                document.getElementById("result").innerText = "Insufficient balance!";
            }
        }

        function showBalance() {
            document.getElementById("result").innerText = "Current Balance: " + balance;
        }
    </script>

</body>
</html>
